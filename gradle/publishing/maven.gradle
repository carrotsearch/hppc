
configure(rootProject) {
  ext {
    published = [
      ":hppc",
    ]

    ossrhStagingApi = "https://ossrh-staging-api.central.sonatype.com"
  }

  task isGitClean() {
    doFirst {
      if (!rootProject.gitStatus.clean) {
        throw new GradleException("Seems like your git checkout isn't clean? Can't publish from this state.")
      }
    }
  }

  task publishSonatype() {
    dependsOn isGitClean
    group = "Publishing"
    description = "Publish Maven artifacts to Sonatype (staging for releases, snapshot repository for snapshots)."
  }

  task promoteToMavenCentral() {
    group = "Publishing"
    description = "Promotes staged artifacts to Maven Central."
    mustRunAfter publishSonatype

    onlyIf {
      project.hasProperty('nexusUsername') &&
      project.hasProperty('nexusPassword') &&
      !project.version.endsWith('-SNAPSHOT')
    }

    doLast {
      def token = "${project.nexusUsername}:${project.nexusPassword}".bytes.encodeBase64().toString()

      // Find open (implicit) staging repositories for this namespace.
      def searchConnection = URI.create("${ossrhStagingApi}/manual/search/repositories?state=open").toURL().openConnection()
      searchConnection.setRequestProperty("Authorization", "Basic ${token}")
      def repositories = new groovy.json.JsonSlurper().parse(searchConnection.inputStream)

      repositories.repositories.each { repo ->
        project.logger.lifecycle("Promoting repository: ${repo.key}")

        def connection = URI.create("${ossrhStagingApi}/manual/upload/repository/${repo.key}?publishing_type=automatic").toURL().openConnection()
        connection.setRequestMethod("POST")
        connection.setRequestProperty("Authorization", "Basic ${token}")

        if (connection.responseCode == 200) {
          project.logger.lifecycle("Successfully promoted repository ${repo.key}")
        } else {
          def errorBody = connection.errorStream?.text ?: "No error body available"
          throw new GradleException("Failed to promote repository ${repo.key}. " +
              "Response code: ${connection.responseCode} (${connection.responseMessage}), error body: ${errorBody}")
        }
      }
    }
  }

  configure(subprojects.findAll { it.path in rootProject.published }) {
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    // Hack: do not generate or publish gradle metadata files.
    tasks.withType(GenerateModuleMetadata).configureEach {
      enabled = false
    }

    plugins.withType(JavaPlugin).configureEach {
      java {
        withSourcesJar()
        withJavadocJar()
      }

      publishing {
        repositories {
          maven {
            name = 'sonatype'
            if (rootProject.version.endsWith('-SNAPSHOT')) {
              url = "https://central.sonatype.com/repository/maven-snapshots/"
            } else {
              url = "${rootProject.ossrhStagingApi}/service/local/staging/deploy/maven2"
            }

            credentials {
              if (project.hasProperty('nexusUsername')) {
                username = project.nexusUsername
              }
              if (project.hasProperty('nexusPassword')) {
                password = project.nexusPassword
              }
            }
          }
        }

        def configurePom = {
          name = "High Performance Primitive Collections"
          url = "https://github.com/carrotsearch/hppc"
          description = "High Performance Primitive Collections: " +
              "data structures (maps, sets, lists, stacks, queues) generated " +
              "for combinations of object and primitive types to conserve JVM " +
              "memory and speed up execution."

          licenses {
            license {
              name = 'Apache 2'
              url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
            }
          }

          organization {
            name = "Carrot Search s.c."
            url = "https://www.carrotsearch.com"
          }

          developers {
            developer {
              id = 'stanislaw.osinski'
              name = 'Stanisław Osiński'
              email = 'stanislaw.osinski@carrotsearch.com'
            }
            developer {
              id = 'dawid.weiss'
              name = 'Dawid Weiss'
              email = 'dawid.weiss@carrotsearch.com'
            }
            developer {
              id = 'bruno.roustant'
              name = 'Bruno Roustant'
              email = 'bruno.roustant@gmail.com'
            }
          }

          scm {
            connection = 'scm:git:git@github.com:carrotsearch/hppc.git'
            developerConnection = 'scm:git:git@github.com:carrotsearch/hppc.git'
            url = 'https://github.com/carrotsearch/hppc'
          }
        }

        publications {
          jars(MavenPublication) {
            from components.java
            groupId = project.group
            artifactId = project.base.archivesName.get()

            pom(configurePom)
          }
        }
      }

      rootProject.tasks.named('publishSonatype').configure {
        dependsOn tasks.named('publishJarsPublicationToSonatypeRepository')
      }

      signing {
        required = { !project.version.endsWith('-SNAPSHOT') }
        sign publishing.publications.jars
      }
    }
  }
}
