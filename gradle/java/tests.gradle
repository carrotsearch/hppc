import org.gradle.api.tasks.testing.logging.*

allprojects {
  plugins.withType(JavaPlugin) {
    dependencies {
      testImplementation libs.randomizedtesting.jupiter
      testImplementation libs.junit.jupiter
      testRuntimeOnly libs.junit.platform.launcher
    }

    test {
      useJUnitPlatform()

      systemProperty "junit.jupiter.execution.parallel.enabled", "false"

      // thread leak detection won't work in full parallel mode so don't enable it.
      // systemProperty "junit.jupiter.execution.parallel.mode.default", "concurrent"
      // systemProperty "junit.jupiter.execution.parallel.mode.classes.default", "concurrent"
      // systemProperty "tests.random.asserting", "false"

      minHeapSize = propertyOrDefault("tests.minheapsize", "256m")
      maxHeapSize = propertyOrDefault("tests.heapsize", "512m")

      testLogging {
        events TestLogEvent.FAILED
        exceptionFormat = TestExceptionFormat.FULL
        showExceptions = true
        showCauses = true
        showStackTraces = true
        stackTraceFilters.clear()
        showStandardStreams = false
      }
    }
  }
}
