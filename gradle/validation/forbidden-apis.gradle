// forbidden-apis is applied and configured by buildinfra (bundled signatures, per-dependency
// signature files under gradle/forbidden-apis). This adds hppc-specific settings on top.

allprojects {
  plugins.withId("java") {
    // Script plugins can't see plugin classes, so match the check tasks by name.
    tasks.matching {
      it.name.startsWith("forbiddenApis") && it.name != "forbiddenApis"
    }.configureEach { task ->
      task.bundledSignatures += ['jdk-reflection']
      task.signaturesFiles += rootProject.files("gradle/forbidden-apis/defaults.all.txt")
    }

    tasks.matching {
      it.name in [
        "forbiddenApisTemplates",
        "forbiddenApisJmh"
      ]
    }.configureEach { task ->
      task.bundledSignatures += ['jdk-system-out']
    }

    tasks.matching {
      it.name in [
        "forbiddenApisTest",
        "forbiddenApisTestTemplates"
      ]
    }.configureEach { task ->
      task.signaturesFiles += rootProject.files("gradle/forbidden-apis/defaults.tests.txt")
    }
  }
}
